<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 打砖块 | WebGL Breakout</title>
    <style>
        :root {
            --bg: #0a0a14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: none;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* UI Overlay */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #score-panel {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            letter-spacing: -1px;
        }

        #combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 48px;
            font-weight: 900;
            color: #ffdd57;
            text-shadow: 0 0 30px rgba(255, 221, 87, 0.8), 0 0 60px rgba(255, 221, 87, 0.4);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        #combo-display.active {
            transform: translate(-50%, -50%) scale(1);
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
        }

        #message h1 {
            font-size: 56px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px rgba(100, 180, 255, 0.6);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        #message p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
        }

        #message button {
            pointer-events: auto;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 12px 32px;
            font-size: 16px;
            border-radius: 50px;
            letter-spacing: 1px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        #message button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(100, 180, 255, 0.3);
        }

        #lives-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .life-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }

        .life-dot.lost {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            #message h1 {
                font-size: 36px;
            }
            .stat-value {
                font-size: 24px;
            }
            #score-panel {
                gap: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="score-panel">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div class="stat-label">Combo</div>
                <div class="stat-value" id="combo-count">x1</div>
            </div>
        </div>

        <div id="combo-display">🔥</div>

        <div id="message">
            <h1>3D 打砖块</h1>
            <p>移动鼠标控制挡板 · 点击发射球</p>
            <button id="start-btn">开始游戏</button>
        </div>

        <div id="lives-container"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ─────────────────────────────────────
        // DOM Elements
        // ─────────────────────────────────────
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const comboCountEl = document.getElementById('combo-count');
        const comboDisplay = document.getElementById('combo-display');
        const messageBox = document.getElementById('message');
        const startBtn = document.getElementById('start-btn');
        const livesContainer = document.getElementById('lives-container');
        const uiLayer = document.getElementById('ui-layer');

        // ─────────────────────────────────────
        // Constants
        // ─────────────────────────────────────
        const GAME_WIDTH = 14;
        const GAME_HEIGHT = 10;
        const BRICK_COLS = 10;
        const BRICK_ROWS = 6;
        const BRICK_W = 1.16;
        const BRICK_H = 0.48;
        const BRICK_D = 0.28;
        const BRICK_GAP = 0.08;
        const PADDLE_W = 2.6;
        const PADDLE_H = 0.28;
        const PADDLE_D = 0.5;
        const BALL_R = 0.22;
        const INITIAL_BALL_SPEED = 7.5;
        const MAX_BALL_SPEED = 14;
        const PADDLE_Y = -4.2;
        const FIELD_TOP = 5.0;
        const FIELD_BOTTOM = -5.5;

        const GRID_LEFT = -(BRICK_COLS * (BRICK_W + BRICK_GAP) - BRICK_GAP) / 2;
        const GRID_TOP = 4.2;

        // Row colors (bottom to top)
        const ROW_COLORS = [
            '#ff4d6a', // red
            '#ff8c42', // orange
            '#ffd23f', // yellow
            '#4ecb71', // green
            '#4cc9f0', // cyan
            '#7b5ea7', // purple
        ];

        const ROW_SCORES = [10, 20, 30, 40, 50, 60];

        // ─────────────────────────────────────
        // Three.js Setup
        // ─────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0a0a18');
        scene.fog = new THREE.Fog('#0a0a18', 8, 35);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 50);
        camera.position.set(0, -0.5, 15);
        camera.lookAt(0, 0, 0);

        // ─────────────────────────────────────
        // Lighting
        // ─────────────────────────────────────
        const ambientLight = new THREE.AmbientLight('#334466', 1.5);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight('#ffffff', 3);
        keyLight.position.set(5, 8, 10);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 50;
        keyLight.shadow.camera.left = -15;
        keyLight.shadow.camera.right = 15;
        keyLight.shadow.camera.top = 10;
        keyLight.shadow.camera.bottom = -10;
        keyLight.shadow.bias = -0.0001;
        keyLight.shadow.normalBias = 0.02;
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight('#8899cc', 0.8);
        fillLight.position.set(-3, 2, 5);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight('#ff8866', 0.6);
        rimLight.position.set(0, -2, 8);
        scene.add(rimLight);

        const ballLight = new THREE.PointLight('#ffffff', 30, 5, 2);
        ballLight.position.set(0, 0, 1);
        ballLight.castShadow = true;
        ballLight.shadow.mapSize.width = 256;
        ballLight.shadow.mapSize.height = 256;
        scene.add(ballLight);

        // ─────────────────────────────────────
        // Background: starfield
        // ─────────────────────────────────────
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 600;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 30;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 20;
            starPositions[i * 3 + 2] = -2 - Math.random() * 8;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({
            color: '#ffffff',
            size: 0.03,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // ─────────────────────────────────────
        // Ground plane (for shadows)
        // ─────────────────────────────────────
        const groundGeo = new THREE.PlaneGeometry(20, 15);
        const groundMat = new THREE.MeshStandardMaterial({
            color: '#111122',
            roughness: 0.9,
            metalness: 0.1,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.z = -2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Field border glow lines
        function createBorderLine(x1, y1, x2, y2) {
            const points = [new THREE.Vector3(x1, y1, 0.05), new THREE.Vector3(x2, y2, 0.05)];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({
                color: '#334466',
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });
            return new THREE.Line(geo, mat);
        }

        const halfW = GAME_WIDTH / 2;
        scene.add(createBorderLine(-halfW, FIELD_TOP, halfW, FIELD_TOP));
        scene.add(createBorderLine(-halfW, FIELD_BOTTOM, halfW, FIELD_BOTTOM));
        scene.add(createBorderLine(-halfW, FIELD_BOTTOM, -halfW, FIELD_TOP));
        scene.add(createBorderLine(halfW, FIELD_BOTTOM, halfW, FIELD_TOP));

        // ─────────────────────────────────────
        // Game State
        // ─────────────────────────────────────
        const STATE = { IDLE: 'idle', AIMING: 'aiming', PLAYING: 'playing', DYING: 'dying', WON: 'won', LOST: 'lost' };

        let gameState = STATE.IDLE;
        let score = 0;
        let level = 1;
        let lives = 3;
        let combo = 0;
        let maxCombo = 0;
        let ballSpeed = INITIAL_BALL_SPEED;
        let bricksRemaining = 0;
        let paddleX = 0;
        let targetPaddleX = 0;
        let ballVX = 0;
        let ballVY = 0;
        let shakeAmount = 0;
        let shakeDecay = 0.85;
        let lastBrickHitTime = 0;
        let mouseActive = false;

        // ─────────────────────────────────────
        // Game Objects
        // ─────────────────────────────────────
        const paddleGroup = new THREE.Group();
        const ballGroup = new THREE.Group();
        const bricksGroup = new THREE.Group();
        const debrisGroup = new THREE.Group();
        const trailGroup = new THREE.Group();
        scene.add(paddleGroup);
        scene.add(ballGroup);
        scene.add(bricksGroup);
        scene.add(debrisGroup);
        scene.add(trailGroup);

        // Paddle
        const paddleGeo = new THREE.BoxGeometry(PADDLE_W, PADDLE_H, PADDLE_D, 4, 1, 2);
        const paddleMat = new THREE.MeshStandardMaterial({
            color: '#ffffff',
            roughness: 0.2,
            metalness: 0.8,
        });
        const paddle = new THREE.Mesh(paddleGeo, paddleMat);
        paddle.castShadow = true;
        paddle.receiveShadow = true;
        paddle.position.y = PADDLE_Y;
        paddleGroup.add(paddle);

        // Paddle edge glow
        const paddleEdgeGeo = new THREE.BoxGeometry(PADDLE_W + 0.08, PADDLE_H + 0.04, PADDLE_D + 0.04);
        const paddleEdgeMat = new THREE.MeshBasicMaterial({
            color: '#88bbff',
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const paddleEdge = new THREE.Mesh(paddleEdgeGeo, paddleEdgeMat);
        paddleGroup.add(paddleEdge);

        // Ball (sphere)
        const ballGeo = new THREE.SphereGeometry(BALL_R, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({
            color: '#ffffff',
            roughness: 0.15,
            metalness: 0.1,
            emissive: '#ffffff',
            emissiveIntensity: 0.8,
        });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        ball.position.set(0, PADDLE_Y + PADDLE_H / 2 + BALL_R + 0.05, 0);
        ballGroup.add(ball);

        // Ball outer glow
        const ballGlowGeo = new THREE.SphereGeometry(BALL_R * 2.2, 16, 16);
        const ballGlowMat = new THREE.MeshBasicMaterial({
            color: '#aaccff',
            transparent: true,
            opacity: 0.25,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const ballGlow = new THREE.Mesh(ballGlowGeo, ballGlowMat);
        ballGroup.add(ballGlow);

        // Ball trail objects
        const trailDots = [];
        const TRAIL_COUNT = 8;
        for (let i = 0; i < TRAIL_COUNT; i++) {
            const dotGeo = new THREE.SphereGeometry(BALL_R * (1 - i / TRAIL_COUNT) * 0.7, 8, 8);
            const dotMat = new THREE.MeshBasicMaterial({
                color: '#aaccff',
                transparent: true,
                opacity: 0.4 * (1 - i / TRAIL_COUNT),
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.visible = false;
            trailGroup.add(dot);
            trailDots.push({ mesh: dot, x: 0, y: 0, age: 0 });
        }

        // ─────────────────────────────────────
        // Particle System
        // ─────────────────────────────────────
        const MAX_PARTICLES = 600;
        const particlesData = [];
        const particlesGeo = new THREE.BufferGeometry();
        const particlesPositions = new Float32Array(MAX_PARTICLES * 3);
        const particlesColors = new Float32Array(MAX_PARTICLES * 3);
        const particlesSizes = new Float32Array(MAX_PARTICLES);

        particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
        particlesGeo.setAttribute('color', new THREE.BufferAttribute(particlesColors, 3));
        particlesGeo.setAttribute('size', new THREE.BufferAttribute(particlesSizes, 1));

        const particlesMat = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.9,
            map: createGlowTexture(),
        });

        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.15, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(0.4, 'rgba(255,255,255,0.4)');
            gradient.addColorStop(0.7, 'rgba(255,255,255,0.05)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        for (let i = 0; i < MAX_PARTICLES; i++) {
            particlesData.push({
                alive: false,
                x: 0,
                y: 0,
                z: 0,
                vx: 0,
                vy: 0,
                vz: 0,
                life: 0,
                maxLife: 0,
                r: 1,
                g: 1,
                b: 1,
            });
            particlesPositions[i * 3] = 0;
            particlesPositions[i * 3 + 1] = -999;
            particlesPositions[i * 3 + 2] = 0;
            particlesColors[i * 3] = 1;
            particlesColors[i * 3 + 1] = 1;
            particlesColors[i * 3 + 2] = 1;
            particlesSizes[i] = 0;
        }
        particlesGeo.attributes.position.needsUpdate = true;
        particlesGeo.attributes.color.needsUpdate = true;
        particlesGeo.attributes.size.needsUpdate = true;

        function spawnParticles(x, y, colorHex, count = 25) {
            const color = new THREE.Color(colorHex);
            let spawned = 0;
            for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
                if (!particlesData[i].alive) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 4;
                    const upwards = -1.5 - Math.random() * 2;
                    particlesData[i].alive = true;
                    particlesData[i].x = x;
                    particlesData[i].y = y;
                    particlesData[i].z = 0.3 + Math.random() * 1.2;
                    particlesData[i].vx = Math.cos(angle) * speed;
                    particlesData[i].vy = Math.sin(angle) * speed + upwards;
                    particlesData[i].vz = (Math.random() - 0.5) * 3;
                    particlesData[i].life = 0.5 + Math.random() * 0.8;
                    particlesData[i].maxLife = particlesData[i].life;
                    particlesData[i].r = color.r;
                    particlesData[i].g = color.g;
                    particlesData[i].b = color.b;
                    spawned++;
                }
            }
        }

        function spawnSparkLine(x1, y1, x2, y2, colorHex, count = 12) {
            const color = new THREE.Color(colorHex);
            let spawned = 0;
            for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
                if (!particlesData[i].alive) {
                    const t = Math.random();
                    const px = x1 + (x2 - x1) * t;
                    const py = y1 + (y2 - y1) * t;
                    particlesData[i].alive = true;
                    particlesData[i].x = px;
                    particlesData[i].y = py;
                    particlesData[i].z = 0.1 + Math.random() * 0.4;
                    particlesData[i].vx = (Math.random() - 0.5) * 1.5;
                    particlesData[i].vy = (Math.random() - 0.5) * 1.5;
                    particlesData[i].vz = (Math.random() - 0.5) * 1;
                    particlesData[i].life = 0.2 + Math.random() * 0.4;
                    particlesData[i].maxLife = particlesData[i].life;
                    particlesData[i].r = color.r;
                    particlesData[i].g = color.g;
                    particlesData[i].b = color.b;
                    spawned++;
                }
            }
        }

        // ─────────────────────────────────────
        // Debris System (small falling cubes)
        // ─────────────────────────────────────
        const debrisPieces = [];
        const MAX_DEBRIS = 80;
        const debrisGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);

        function spawnDebris(x, y, colorHex) {
            const color = new THREE.Color(colorHex);
            const count = 4 + Math.floor(Math.random() * 5);
            for (let i = 0; i < count; i++) {
                if (debrisPieces.length >= MAX_DEBRIS) {
                    const old = debrisPieces.shift();
                    debrisGroup.remove(old.mesh);
                    old.mesh.geometry && old.mesh.geometry !== debrisGeo && old.mesh.geometry.dispose();
                }
                const mat = new THREE.MeshStandardMaterial({
                    color: color,
                    roughness: 0.4,
                    metalness: 0.6,
                    emissive: color,
                    emissiveIntensity: 0.3,
                });
                const piece = new THREE.Mesh(debrisGeo, mat);
                piece.position.set(x, y, 0.15);
                piece.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                piece.castShadow = true;
                piece.scale.setScalar(0.5 + Math.random() * 0.5);
                debrisGroup.add(piece);
                debrisPieces.push({
                    mesh: piece,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4 - 2,
                    vz: (Math.random() - 0.5) * 2,
                    rotX: (Math.random() - 0.5) * 12,
                    rotY: (Math.random() - 0.5) * 12,
                    rotZ: (Math.random() - 0.5) * 12,
                    life: 1.2 + Math.random() * 0.8,
                });
            }
        }

        // ─────────────────────────────────────
        // Bricks
        // ─────────────────────────────────────
        const brickMeshes = []; // 2D array [row][col]
        const brickData = []; // 2D array of {alive, mesh, row, col}

        function createBricks() {
            // Clear existing
            while (bricksGroup.children.length > 0) {
                const child = bricksGroup.children[0];
                if (child.material) child.material.dispose();
                bricksGroup.remove(child);
            }
            brickMeshes.length = 0;
            brickData.length = 0;
            bricksRemaining = 0;

            const brickGeo = new THREE.BoxGeometry(BRICK_W, BRICK_H, BRICK_D, 2, 1, 1);

            for (let row = 0; row < BRICK_ROWS; row++) {
                brickMeshes[row] = [];
                brickData[row] = [];
                for (let col = 0; col < BRICK_COLS; col++) {
                    const x = GRID_LEFT + col * (BRICK_W + BRICK_GAP) + BRICK_W / 2;
                    const y = GRID_TOP - row * (BRICK_H + BRICK_GAP) - BRICK_H / 2;

                    const colorHex = ROW_COLORS[row];
                    const mat = new THREE.MeshStandardMaterial({
                        color: colorHex,
                        roughness: 0.25,
                        metalness: 0.55,
                    });

                    const brick = new THREE.Mesh(brickGeo, mat);
                    brick.position.set(x, y, 0);
                    brick.castShadow = true;
                    brick.receiveShadow = true;

                    // Subtle bevel effect with wireframe overlay
                    const edgeGeo = new THREE.EdgesGeometry(brickGeo);
                    const edgeMat = new THREE.LineBasicMaterial({
                        color: '#ffffff',
                        transparent: true,
                        opacity: 0.15,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                    });
                    const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
                    brick.add(edgeLine);

                    bricksGroup.add(brick);
                    brickMeshes[row][col] = brick;
                    brickData[row][col] = { alive: true, mesh: brick, row, col };
                    bricksRemaining++;
                }
            }
        }

        function destroyBrick(row, col) {
            if (!brickData[row] || !brickData[row][col] || !brickData[row][col].alive) return false;

            const data = brickData[row][col];
            data.alive = false;
            bricksRemaining--;

            const brick = data.mesh;
            const x = brick.position.x;
            const y = brick.position.y;
            const colorHex = ROW_COLORS[row];

            // Visual: hide brick
            brick.visible = false;

            // Particle explosion
            spawnParticles(x, y, colorHex, 30);
            // Debris
            spawnDebris(x, y, colorHex);

            // Score
            const baseScore = ROW_SCORES[row];
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            const comboMult = Math.min(combo, 10);
            const earnedScore = baseScore * comboMult;
            score += earnedScore;
            lastBrickHitTime = performance.now() / 1000;

            // Shake
            shakeAmount = Math.max(shakeAmount, 0.08 + combo * 0.01);

            // Ball speed increase
            ballSpeed = Math.min(ballSpeed + 0.08, MAX_BALL_SPEED);

            updateUI();

            return true;
        }

        // ─────────────────────────────────────
        // Ball trail tracking
        // ─────────────────────────────────────
        const trailHistory = [];
        const TRAIL_HISTORY_MAX = TRAIL_COUNT;

        // ─────────────────────────────────────
        // Helper: normalize velocity
        // ─────────────────────────────────────
        function setBallVelocity(vx, vy, speed) {
            const len = Math.sqrt(vx * vx + vy * vy);
            const s = speed || ballSpeed;
            ballVX = (vx / len) * s;
            ballVY = (vy / len) * s;

            // Ensure minimum vertical component to avoid horizontal locks
            const minVY = s * 0.25;
            if (Math.abs(ballVY) < minVY) {
                ballVY = ballVY >= 0 ? minVY : -minVY;
                const remaining = Math.sqrt(Math.max(0, s * s - ballVY * ballVY));
                ballVX = ballVX >= 0 ? remaining : -remaining;
            }
        }

        function launchBall() {
            // Random angle within ±30 degrees from straight up
            const angle = (Math.random() - 0.5) * (Math.PI / 6);
            setBallVelocity(Math.sin(angle), Math.cos(angle), ballSpeed);
            gameState = STATE.PLAYING;
        }

        // ─────────────────────────────────────
        // Reset ball to paddle
        // ─────────────────────────────────────
        function resetBall() {
            ballVX = 0;
            ballVY = 0;
            ball.position.set(paddleGroup.position.x, PADDLE_Y + PADDLE_H / 2 + BALL_R + 0.05, 0.05);
            ballLight.position.copy(ball.position);
            ballLight.intensity = 30;
            trailHistory.length = 0;
            combo = 0;
            updateUI();
        }

        // ─────────────────────────────────────
        // UI
        // ─────────────────────────────────────
        function updateUI() {
            scoreEl.textContent = score;
            levelEl.textContent = level;
            comboCountEl.textContent = `x${Math.min(combo, 10)}`;

            // Combo popup
            if (combo >= 3 && gameState === STATE.PLAYING) {
                comboDisplay.textContent = combo >= 8 ? '💥' : combo >= 5 ? '⚡' : '🔥';
                comboDisplay.classList.add('active');
                clearTimeout(comboDisplay._timeout);
                comboDisplay._timeout = setTimeout(() => {
                    comboDisplay.classList.remove('active');
                }, 600);
            }
        }

        function updateLivesDisplay() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                const dot = document.createElement('div');
                dot.className = 'life-dot';
                livesContainer.appendChild(dot);
            }
        }

        function showMessage(title, subtitle, buttonText) {
            messageBox.classList.remove('hidden');
            messageBox.querySelector('h1').textContent = title;
            messageBox.querySelector('p').textContent = subtitle;
            const btn = messageBox.querySelector('button');
            if (buttonText) {
                btn.textContent = buttonText;
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        }

        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        // ─────────────────────────────────────
        // Game Flow
        // ─────────────────────────────────────
        function startGame() {
            score = 0;
            level = 1;
            lives = 3;
            combo = 0;
            maxCombo = 0;
            ballSpeed = INITIAL_BALL_SPEED;
            shakeAmount = 0;
            paddleX = 0;
            targetPaddleX = 0;
            paddleGroup.position.set(0, PADDLE_Y, 0);

            // Clear debris
            while (debrisPieces.length > 0) {
                const d = debrisPieces.pop();
                debrisGroup.remove(d.mesh);
                d.mesh.material.dispose();
            }

            // Clear particles
            for (let i = 0; i < MAX_PARTICLES; i++) {
                particlesData[i].alive = false;
                particlesPositions[i * 3 + 1] = -999;
                particlesSizes[i] = 0;
            }
            particlesGeo.attributes.position.needsUpdate = true;
            particlesGeo.attributes.size.needsUpdate = true;

            createBricks();
            resetBall();
            updateUI();
            updateLivesDisplay();
            hideMessage();
            gameState = STATE.AIMING;

            ballGroup.visible = true;
            ballGlow.visible = true;
        }

        function loseLife() {
            lives--;
            updateLivesDisplay();
            combo = 0;
            updateUI();

            if (lives <= 0) {
                gameState = STATE.LOST;
                ballGroup.visible = false;
                ballGlow.visible = false;
                ballLight.intensity = 0;
                showMessage('游戏结束', `最终得分: ${score}  最大连击: x${maxCombo}`, '再来一局');
            } else {
                gameState = STATE.AIMING;
                resetBall();
                ballSpeed = INITIAL_BALL_SPEED;
                showMessage('失去一条命', `剩余 ${lives} 条命 · 点击继续`, '继续');
            }
        }

        function levelComplete() {
            gameState = STATE.WON;
            ballGroup.visible = false;
            ballGlow.visible = false;
            ballLight.intensity = 0;
            level++;

            // Celebration particles
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const rx = (Math.random() - 0.5) * GAME_WIDTH;
                    const ry = (Math.random() - 0.5) * GAME_HEIGHT;
                    spawnParticles(rx, ry, ROW_COLORS[Math.floor(Math.random() * 6)], 40);
                }, i * 100);
            }

            showMessage(`第 ${level - 1} 关 通过!`, `总分: ${score} · 准备进入第 ${level} 关`, '下一关');
        }

        function nextLevel() {
            ballSpeed = INITIAL_BALL_SPEED + (level - 1) * 1.5;
            paddleX = 0;
            targetPaddleX = 0;
            paddleGroup.position.set(0, PADDLE_Y, 0);

            // Clear debris
            while (debrisPieces.length > 0) {
                const d = debrisPieces.pop();
                debrisGroup.remove(d.mesh);
                d.mesh.material.dispose();
            }

            // Clear particles
            for (let i = 0; i < MAX_PARTICLES; i++) {
                particlesData[i].alive = false;
                particlesPositions[i * 3 + 1] = -999;
                particlesSizes[i] = 0;
            }
            particlesGeo.attributes.position.needsUpdate = true;
            particlesGeo.attributes.size.needsUpdate = true;

            createBricks();
            resetBall();
            updateUI();
            updateLivesDisplay();
            hideMessage();
            gameState = STATE.AIMING;

            ballGroup.visible = true;
            ballGlow.visible = true;
        }

        // ─────────────────────────────────────
        // Collision Detection
        // ─────────────────────────────────────
        function ballBrickCollision(bx, by) {
            // Find grid cell
            const col = Math.floor((bx - GRID_LEFT) / (BRICK_W + BRICK_GAP));
            const row = Math.floor((GRID_TOP - by) / (BRICK_H + BRICK_GAP));

            // Check nearby cells
            let hit = false;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const r = row + dr;
                    const c = col + dc;
                    if (r >= 0 && r < BRICK_ROWS && c >= 0 && c < BRICK_COLS && brickData[r] && brickData[r][c] && brickData[r][
                            c
                        ].alive) {
                        const brick = brickData[r][c].mesh;
                        const bx_min = brick.position.x - BRICK_W / 2 - BALL_R;
                        const bx_max = brick.position.x + BRICK_W / 2 + BALL_R;
                        const by_min = brick.position.y - BRICK_H / 2 - BALL_R;
                        const by_max = brick.position.y + BRICK_H / 2 + BALL_R;

                        if (bx >= bx_min && bx <= bx_max && by >= by_min && by <= by_max) {
                            // Determine collision side
                            const overlapLeft = bx_max - bx;
                            const overlapRight = bx - bx_min;
                            const overlapTop = by_max - by;
                            const overlapBottom = by - by_min;
                            const minOverlapX = Math.min(overlapLeft, overlapRight);
                            const minOverlapY = Math.min(overlapTop, overlapBottom);

                            if (minOverlapX < minOverlapY) {
                                // Horizontal bounce
                                ballVX = -ballVX;
                            } else {
                                // Vertical bounce
                                ballVY = -ballVY;
                            }

                            destroyBrick(r, c);
                            hit = true;
                            break;
                        }
                    }
                }
                if (hit) break;
            }
            return hit;
        }

        function ballPaddleCollision(bx, by) {
            const px = paddleGroup.position.x;
            const py = PADDLE_Y;
            const halfW = PADDLE_W / 2 + BALL_R;
            const halfH = PADDLE_H / 2 + BALL_R;

            if (bx >= px - halfW && bx <= px + halfW && by >= py - halfH && by <= py + halfH) {
                // Hit position on paddle (-1 to 1)
                const hitPos = (bx - px) / (PADDLE_W / 2);
                const clampedHit = Math.max(-1, Math.min(1, hitPos));

                // Reflection angle: max 65 degrees
                const maxAngle = (65 * Math.PI) / 180;
                const angle = clampedHit * maxAngle;

                // Ball always goes upward after paddle hit
                const speed = Math.sqrt(ballVX * ballVX + ballVY * ballVY);
                const newVX = Math.sin(angle) * speed;
                const newVY = Math.abs(Math.cos(angle) * speed);

                ballVX = newVX;
                ballVY = newVY;

                // Reset combo on paddle hit
                combo = 0;
                updateUI();

                // Position ball above paddle
                ball.position.y = py + halfH + 0.01;

                // Spark effect at contact point
                spawnSparkLine(bx - 0.3, py, bx + 0.3, py, '#ffffff', 8);

                // Slight shake
                shakeAmount = Math.max(shakeAmount, 0.03);

                return true;
            }
            return false;
        }

        // ─────────────────────────────────────
        // Input
        // ─────────────────────────────────────
        // ── Key state tracker for continuous input ──
        const keysPressed = {};

        function getMouseX(clientX) {
            const ndc = (clientX / window.innerWidth) * 2 - 1;
            const halfW = GAME_WIDTH / 2 - PADDLE_W / 2 - 0.3;
            return ndc * halfW;
        }

        window.addEventListener('mousemove', (e) => {
            mouseActive = true;
            targetPaddleX = getMouseX(e.clientX);
        });

        window.addEventListener('touchmove', (e) => {
            mouseActive = true;
            targetPaddleX = getMouseX(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('click', () => {
            if (gameState === STATE.AIMING) {
                launchBall();
                hideMessage();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameState === STATE.AIMING) {
                    launchBall();
                    hideMessage();
                }
                return;
            }
            // Track key state for continuous movement in game loop
            if (e.code === 'ArrowLeft' || e.code === 'KeyA' ||
                e.code === 'ArrowRight' || e.code === 'KeyD') {
                e.preventDefault();
                keysPressed[e.code] = true;
                mouseActive = false;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA' ||
                e.code === 'ArrowRight' || e.code === 'KeyD') {
                keysPressed[e.code] = false;
            }
        });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (gameState === STATE.IDLE) {
                startGame();
            } else if (gameState === STATE.LOST) {
                startGame();
            } else if (gameState === STATE.WON) {
                nextLevel();
            } else if (gameState === STATE.AIMING) {
                launchBall();
                hideMessage();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ─────────────────────────────────────
        // Game Loop
        // ─────────────────────────────────────
        const clock = new THREE.Clock();
        let lastFrameTime = 0;

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            const now = timestamp / 1000;

            // ── Paddle movement ─────────────────
            const halfLimit = GAME_WIDTH / 2 - PADDLE_W / 2;
            const KEYBOARD_SPEED = 10; // units per second for keyboard

            if (gameState === STATE.AIMING || gameState === STATE.PLAYING) {
                // Keyboard: continuous movement based on held keys
                if (keysPressed['ArrowLeft'] || keysPressed['KeyA']) {
                    targetPaddleX -= KEYBOARD_SPEED * dt;
                }
                if (keysPressed['ArrowRight'] || keysPressed['KeyD']) {
                    targetPaddleX += KEYBOARD_SPEED * dt;
                }
                targetPaddleX = Math.max(-halfLimit, Math.min(halfLimit, targetPaddleX));

                // Direct follow (no laggy lerp) — instant response
                paddleX = targetPaddleX;
                paddleGroup.position.x = paddleX;
            }

            // ── Ball physics ────────────────────
            if (gameState === STATE.PLAYING) {
                const bx = ball.position.x;
                const by = ball.position.y;

                // Move ball
                ball.position.x += ballVX * dt;
                ball.position.y += ballVY * dt;

                const newBx = ball.position.x;
                const newBy = ball.position.y;

                // Wall collisions (left/right)
                if (newBx - BALL_R <= -GAME_WIDTH / 2) {
                    ball.position.x = -GAME_WIDTH / 2 + BALL_R;
                    ballVX = Math.abs(ballVX);
                    spawnSparkLine(-GAME_WIDTH / 2, newBy - 0.2, -GAME_WIDTH / 2, newBy + 0.2, '#88bbff', 6);
                    shakeAmount = Math.max(shakeAmount, 0.02);
                }
                if (newBx + BALL_R >= GAME_WIDTH / 2) {
                    ball.position.x = GAME_WIDTH / 2 - BALL_R;
                    ballVX = -Math.abs(ballVX);
                    spawnSparkLine(GAME_WIDTH / 2, newBy - 0.2, GAME_WIDTH / 2, newBy + 0.2, '#88bbff', 6);
                    shakeAmount = Math.max(shakeAmount, 0.02);
                }

                // Top wall
                if (newBy + BALL_R >= FIELD_TOP) {
                    ball.position.y = FIELD_TOP - BALL_R;
                    ballVY = -Math.abs(ballVY);
                    spawnSparkLine(newBx - 0.3, FIELD_TOP, newBx + 0.3, FIELD_TOP, '#88bbff', 6);
                }

                // Paddle collision
                ballPaddleCollision(ball.position.x, ball.position.y);

                // Brick collision
                const didHit = ballBrickCollision(ball.position.x, ball.position.y);

                // Check if all bricks destroyed
                if (bricksRemaining <= 0) {
                    levelComplete();
                }

                // Ball fell below
                if (ball.position.y - BALL_R < FIELD_BOTTOM) {
                    // Death particles
                    spawnParticles(ball.position.x, ball.position.y, '#ff4466', 40);
                    shakeAmount = Math.max(shakeAmount, 0.15);
                    gameState = STATE.DYING;
                    ballGroup.visible = false;
                    ballGlow.visible = false;
                    ballLight.intensity = 0;
                    setTimeout(() => loseLife(), 600);
                }

                // Update ball light
                ballLight.position.copy(ball.position);
                ballLight.intensity = 25 + Math.sin(now * 8) * 5;

                // Update trail
                if (gameState === STATE.PLAYING) {
                    trailHistory.push({ x: ball.position.x, y: ball.position.y });
                    if (trailHistory.length > TRAIL_HISTORY_MAX) trailHistory.shift();
                }
            }

            // ── Update ball trail dots ──────────
            for (let i = 0; i < TRAIL_COUNT; i++) {
                const dot = trailDots[i];
                const idx = trailHistory.length - 1 - Math.floor(i * (trailHistory.length / TRAIL_COUNT));
                if (trailHistory.length > 0 && idx >= 0 && idx < trailHistory.length) {
                    dot.mesh.visible = gameState === STATE.PLAYING;
                    dot.mesh.position.set(trailHistory[idx].x, trailHistory[idx].y, 0.02);
                    dot.mesh.material.opacity = 0.35 * (1 - i / TRAIL_COUNT);
                } else {
                    dot.mesh.visible = false;
                }
            }

            // ── Update particles ────────────────
            let anyParticleAlive = false;
            for (let i = 0; i < MAX_PARTICLES; i++) {
                const p = particlesData[i];
                if (p.alive) {
                    p.life -= dt;
                    if (p.life <= 0) {
                        p.alive = false;
                        particlesPositions[i * 3 + 1] = -999;
                        particlesSizes[i] = 0;
                    } else {
                        const t = p.life / p.maxLife;
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        p.z += p.vz * dt;
                        p.vy -= 3 * dt; // gravity
                        p.vx *= 0.99;
                        p.vz *= 0.97;

                        particlesPositions[i * 3] = p.x;
                        particlesPositions[i * 3 + 1] = p.y;
                        particlesPositions[i * 3 + 2] = p.z;

                        // Fade alpha through size
                        particlesSizes[i] = t * 0.12;

                        // Color fade to warm
                        const fadeT = 1 - t;
                        particlesColors[i * 3] = p.r * t + 1 * fadeT * 0.5;
                        particlesColors[i * 3 + 1] = p.g * t + 0.6 * fadeT * 0.5;
                        particlesColors[i * 3 + 2] = p.b * t + 0.2 * fadeT * 0.5;

                        anyParticleAlive = true;
                    }
                }
            }
            if (anyParticleAlive || particlesGeo.attributes.position.needsUpdate) {
                particlesGeo.attributes.position.needsUpdate = true;
                particlesGeo.attributes.color.needsUpdate = true;
                particlesGeo.attributes.size.needsUpdate = true;
            }

            // ── Update debris ───────────────────
            for (let i = debrisPieces.length - 1; i >= 0; i--) {
                const d = debrisPieces[i];
                d.life -= dt;
                if (d.life <= 0) {
                    debrisGroup.remove(d.mesh);
                    d.mesh.material.dispose();
                    debrisPieces.splice(i, 1);
                } else {
                    d.mesh.position.x += d.vx * dt;
                    d.mesh.position.y += d.vy * dt;
                    d.mesh.position.z += d.vz * dt;
                    d.vy -= 6 * dt;
                    d.vz -= 4 * dt;
                    d.mesh.rotation.x += d.rotX * dt;
                    d.mesh.rotation.y += d.rotY * dt;
                    d.mesh.rotation.z += d.rotZ * dt;

                    // Fade below field
                    if (d.mesh.position.y < FIELD_BOTTOM - 2 || d.mesh.position.z < -3) {
                        d.life = 0;
                    }
                }
            }

            // ── Camera shake ────────────────────
            if (shakeAmount > 0.001) {
                const sx = (Math.random() - 0.5) * shakeAmount * 2;
                const sy = (Math.random() - 0.5) * shakeAmount * 2;
                camera.position.x = sx;
                camera.position.y = -0.5 + sy;
                shakeAmount *= shakeDecay;
            } else {
                camera.position.x += (0 - camera.position.x) * 0.1;
                camera.position.y += (-0.5 - camera.position.y) * 0.1;
                shakeAmount = 0;
            }

            // ── Paddle idle animation ───────────
            if (gameState === STATE.IDLE) {
                paddleGroup.position.x = Math.sin(now * 0.8) * 2;
                paddleX = paddleGroup.position.x;
            }

            // ── Ball idle glow pulse ────────────
            if (gameState === STATE.AIMING) {
                ball.position.x = paddleGroup.position.x;
                ball.position.y = PADDLE_Y + PADDLE_H / 2 + BALL_R + 0.05;
                ballLight.position.copy(ball.position);
                ballLight.intensity = 20 + Math.sin(now * 4) * 10;
                ballGlow.material.opacity = 0.2 + Math.sin(now * 4) * 0.1;
                ballMat.emissiveIntensity = 0.6 + Math.sin(now * 4) * 0.4;
            }

            // ── Starfield rotation ──────────────
            stars.rotation.z += dt * 0.03;
            stars.rotation.x += dt * 0.015;

            // ── Render ──────────────────────────
            renderer.render(scene, camera);
            lastFrameTime = now;
        }

        // ─────────────────────────────────────
        // Init
        // ─────────────────────────────────────
        createBricks();
        updateLivesDisplay();
        updateUI();

        // Start with idle state - ball visible, paddle moving gently
        ballGroup.visible = true;
        ballGlow.visible = true;
        ballLight.intensity = 25;
        showMessage('3D 打砖块', '移动鼠标控制挡板 · 点击或按空格发射', '开始游戏');

        requestAnimationFrame(animate);

        console.log('🕹️  3D Breakout ready!');
        console.log('   🖱️  Move mouse to control paddle');
        console.log('   🖱️  Click or press Space to launch ball');
        console.log('   ⌨️  Arrow keys / A,D also work');
        console.log('   🎯  Hit angle depends on where ball hits paddle');
        console.log('   🔥  Chain brick hits for combo multiplier!');
    </script>
</body>
</html>
