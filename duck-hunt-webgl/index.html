<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WebGL 黄昏猎鸭 — Duck Hunt</title>
<style>
  :root {
    --bg: #1a0a02;
    --accent: #f0a040;
    --text: #e8d8c0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    overflow: hidden;
    font-family: 'Georgia', 'Noto Serif SC', serif;
    cursor: crosshair;
    height: 100dvh; width: 100vw;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; }

  /* Crosshair */
  #crosshair {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    width: 60px; height: 60px;
    transform: translate(-50%, -50%);
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute;
    background: rgba(255,255,255,0.7);
    box-shadow: 0 0 4px rgba(255,255,255,0.4);
  }
  #crosshair::before {
    top: 50%; left: 8px; right: 8px; height: 1.5px;
    transform: translateY(-50%);
  }
  #crosshair::after {
    left: 50%; top: 8px; bottom: 8px; width: 1.5px;
    transform: translateX(-50%);
  }
  #crosshair .ring {
    position: absolute;
    inset: 6px;
    border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 50%;
  }
  #crosshair .dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 4px; height: 4px;
    background: #ff3333;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 6px #ff0000;
  }

  /* HUD */
  #hud {
    position: fixed; top: 14px; left: 14px; right: 14px;
    display: flex; justify-content: space-between;
    pointer-events: none; z-index: 10;
  }
  .hud-panel {
    background: rgba(20,10,5,0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(200,150,100,0.15);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--text);
  }
  .hud-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(220,180,140,0.5); }
  .hud-value { font-size: 22px; font-weight: 700; }
  .hud-value.score { color: var(--accent); }
  .hud-value.ammo { color: #e07050; }

  /* Shot feedback */
  .muzzle-flash {
    position: fixed; pointer-events: none; z-index: 40;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,50,0.6) 0%, rgba(255,100,20,0.2) 40%, transparent 70%);
    transform: translate(-50%, -50%);
    animation: flashFade 0.12s ease-out forwards;
  }
  @keyframes flashFade {
    0% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); }
  }

  /* Overlays */
  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    background: radial-gradient(ellipse at center, rgba(30,12,5,0.92), rgba(8,3,0,0.97));
    pointer-events: all;
  }
  #gameover-screen { display: none; }
  .title {
    font-size: clamp(34px, 7vw, 58px); font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #f0a040, #e06030, #f0a040);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .subtitle { font-size: 12px; color: rgba(200,160,120,0.45); letter-spacing: 3px; margin-bottom: 30px; }
  .btn {
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-family: inherit; font-size: 15px; letter-spacing: 2px;
    padding: 10px 30px; border-radius: 6px;
    cursor: pointer; transition: all 0.3s;
  }
  .btn:hover, .btn:active {
    background: rgba(240,160,64,0.15);
    box-shadow: 0 0 20px rgba(240,160,64,0.3);
  }
  .final-score { font-size: 42px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .final-label { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.35); margin-bottom: 24px; }

  /* +score popup */
  .score-pop {
    position: fixed; pointer-events: none; z-index: 50;
    font-size: 18px; font-weight: 700; color: var(--accent);
    text-shadow: 0 0 8px rgba(240,160,64,0.6);
    animation: popUp 0.8s ease-out forwards;
  }
  @keyframes popUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
  }
</style>
</head>
<body>

<div id="start-screen" class="overlay">
  <div class="title">黄 昏 猎 鸭</div>
  <div class="subtitle">D U C K &nbsp; H U N T &nbsp; · &nbsp; W E B G L</div>
  <button class="btn" id="start-btn">🔫 开始狩猎</button>
</div>

<div id="gameover-screen" class="overlay">
  <div class="final-label">狩 猎 得 分</div>
  <div class="final-score" id="final-score">0</div>
  <button class="btn" id="restart-btn">再次出猎</button>
</div>

<div id="hud">
  <div class="hud-panel">
    <div class="hud-label">得分</div>
    <div class="hud-value score" id="score-display">0</div>
  </div>
  <div class="hud-panel">
    <div class="hud-label">命中率</div>
    <div class="hud-value ammo" id="accuracy-display">-</div>
  </div>
</div>

<div id="crosshair">
  <div class="ring"></div>
  <div class="dot"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ======================== AUDIO ========================
class SFX {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }
  play(f,dur,vol=0.06,type='square',slide=0) {
    if(!this.ctx) return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.linearRampToValueAtTime(f+slide,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur);
  }
  shoot(){this.play(200,0.15,0.08,'sawtooth',-80);this.play(60,0.2,0.06,'triangle');}
  hit(){this.play(800,0.08,0.04,'square');this.play(600,0.06,0.03,'sine');}
  miss(){this.play(80,0.3,0.04,'triangle');}
  duckQuack(){this.play(300+Math.random()*200,0.12,0.03,'sawtooth');}
}
const sfx = new SFX();

// ======================== SCENE ========================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x331a08, 0.00025);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.3, 200);
camera.position.set(0, 2.4, 6);
camera.lookAt(0, 0.5, -15);

// ======================== SKY & SUN ========================
// Sky gradient sphere
const skyGeo = new THREE.SphereGeometry(80, 32, 24);
const skyMat = new THREE.ShaderMaterial({
  uniforms: {},
  vertexShader: `
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vPos;
    void main() {
      float h = normalize(vPos).y;
      // Sunset gradient: deep blue top → orange/pink middle → warm gold horizon
      vec3 top = vec3(0.08, 0.06, 0.25);
      vec3 mid = vec3(0.55, 0.20, 0.12);
      vec3 hor = vec3(0.95, 0.45, 0.15);
      vec3 low = vec3(0.6, 0.25, 0.08);

      float t1 = smoothstep(-0.15, 0.1, h);
      float t2 = smoothstep(0.05, 0.25, h);
      float t3 = smoothstep(0.2, 0.6, h);

      vec3 col = mix(hor, low, t1);
      col = mix(col, mid, t2);
      col = mix(col, top, t3);

      // Sun glow
      float sunDist = length(vPos.xz - vec2(0.0, -55.0));
      float sunGlow = exp(-sunDist * 0.08) * 0.3;
      col += vec3(1.0, 0.55, 0.15) * sunGlow;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.BackSide, depthWrite: false
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// Sun disc
const sunGeo = new THREE.SphereGeometry(2.5, 32, 32);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc66 });
const sun = new THREE.Mesh(sunGeo, sunMat);
sun.position.set(0, -3, -50);

// Sun glow layers
for (let i = 0; i < 3; i++) {
  const glowGeo = new THREE.SphereGeometry(3.5 + i*2, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(0.12, 1, 0.5 - i*0.15),
    transparent: true, opacity: 0.15 - i*0.04,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.copy(sun.position);
  scene.add(glow);
}
scene.add(sun);

// ======================== MOUNTAINS ========================
function createMountainRow(z, color, scaleY, count) {
  const group = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const h = 2 + Math.random() * scaleY;
    const w = 2 + Math.random() * 4;
    const geo = new THREE.ConeGeometry(w, h, 4 + Math.floor(Math.random()*3));
    // Flatten slightly
    const pos = geo.attributes.position;
    for (let j = 0; j < pos.count; j++) {
      const y = pos.getY(j);
      if (y < 0) pos.setY(j, y * 0.3);
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color,
      roughness: 0.85, metalness: 0.02,
      flatShading: true
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.set((i - count/2) * 5 + (Math.random()-0.5)*3, -h*0.15, z + (Math.random()-0.5)*4);
    m.castShadow = true; m.receiveShadow = true;
    group.add(m);
  }
  return group;
}

// Distant mountains (silhouette)
scene.add(createMountainRow(-35, 0x4a2520, 12, 14));
scene.add(createMountainRow(-28, 0x5a3025, 9, 12));
// Mid mountains (more detail)
scene.add(createMountainRow(-22, 0x3d2a18, 8, 10));
// Near hills
scene.add(createMountainRow(-15, 0x4a3520, 5, 8));

// ======================== WATER / MARSH ========================
const waterGeo = new THREE.PlaneGeometry(60, 30, 40, 20);
const waterPos = waterGeo.attributes.position;
for (let i = 0; i < waterPos.count; i++) {
  const x = waterPos.getX(i), y = waterPos.getY(i);
  waterPos.setZ(i, Math.sin(x*0.4)*0.3 + Math.cos(y*0.5)*0.2);
}
waterGeo.computeVertexNormals();
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x553322,
  roughness: 0.3, metalness: 0.6,
  transparent: true, opacity: 0.7
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2;
water.position.set(0, -1.8, -18);
water.receiveShadow = true;
scene.add(water);

// ======================== GROUND ========================
const groundGeo = new THREE.PlaneGeometry(60, 20);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x4a3520,
  roughness: 0.9, metalness: 0.01
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.set(0, -2.0, -7);
ground.receiveShadow = true;
scene.add(ground);

// ======================== GRASS CLUMPS ========================
function createGrassClump(x, z, count) {
  const group = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const h = 0.4 + Math.random() * 0.9;
    const geo = new THREE.ConeGeometry(0.04, h, 4);
    const hue = 0.12 + Math.random() * 0.15;
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(hue, 0.4, 0.15 + Math.random()*0.2),
      roughness: 0.9, flatShading: true
    });
    const blade = new THREE.Mesh(geo, mat);
    blade.position.set((Math.random()-0.5)*0.6, h/2, (Math.random()-0.5)*0.6);
    blade.rotation.z = (Math.random()-0.5)*0.4;
    blade.rotation.x = (Math.random()-0.5)*0.4;
    blade.castShadow = true;
    group.add(blade);
  }
  group.position.set(x, -2.0, z);
  return group;
}

// Reed / tall grass
function createReed(x, z) {
  const group = new THREE.Group();
  const h = 1.2 + Math.random() * 1.5;
  const stalkGeo = new THREE.CylinderGeometry(0.03, 0.04, h, 5);
  const stalkMat = new THREE.MeshStandardMaterial({ color: 0x5a4a20, roughness: 0.8 });
  const stalk = new THREE.Mesh(stalkGeo, stalkMat);
  stalk.position.y = h/2;
  group.add(stalk);

  // Reed head
  const headGeo = new THREE.ConeGeometry(0.06, 0.25, 5);
  const headMat = new THREE.MeshStandardMaterial({ color: 0x6a5a30, roughness: 0.7 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = h + 0.08;
  group.add(head);

  group.position.set(x, -2.0, z);
  group.rotation.z = (Math.random()-0.5)*0.3;
  return group;
}

// Scatter grass & reeds in foreground
for (let i = 0; i < 80; i++) {
  const x = (Math.random()-0.5)*25;
  const z = -2 - Math.random()*10;
  scene.add(createGrassClump(x, z, 5+Math.floor(Math.random()*8)));
}

for (let i = 0; i < 30; i++) {
  const x = (Math.random()-0.5)*22;
  const z = -2 - Math.random()*8;
  scene.add(createReed(x, z));
}

// ======================== TREES (silhouette) ========================
function createTree(x, z, scale) {
  const g = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.12, 0.18, 3*scale, 5);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.9 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 1.5*scale;
  trunk.castShadow = true;
  g.add(trunk);

  for (let i = 0; i < 4; i++) {
    const foliageGeo = new THREE.ConeGeometry(1.2*scale*(1-i*0.22), 1.5*scale, 6);
    const foliageMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.1, 0.3, 0.08 + i*0.04),
      roughness: 0.85, flatShading: true
    });
    const foliage = new THREE.Mesh(foliageGeo, foliageMat);
    foliage.position.y = 2.0*scale + i*1.2*scale;
    foliage.castShadow = true;
    g.add(foliage);
  }

  g.position.set(x, -2.0, z);
  return g;
}

[-10,-7,-3,3,7,10,12].forEach(x => {
  scene.add(createTree(x, -5-Math.random()*3, 0.8+Math.random()*0.6));
});

// ======================== DUCK MODEL ========================
function createDuck() {
  const g = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x5a4a20, roughness: 0.5, metalness: 0.1 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x3a2a10, roughness: 0.5, metalness: 0.1 });
  const headMat = new THREE.MeshStandardMaterial({ color: 0x2a4a20, roughness: 0.4, metalness: 0.1 });
  const beakMat = new THREE.MeshStandardMaterial({ color: 0xdda020, roughness: 0.3, metalness: 0.2 });
  const wingMat = new THREE.MeshStandardMaterial({ color: 0x4a3a18, roughness: 0.5, metalness: 0.1 });
  const whiteMat = new THREE.MeshStandardMaterial({ color: 0xe8d8b0, roughness: 0.4, metalness: 0.05 });

  // Body (elongated sphere)
  const bodyGeo = new THREE.SphereGeometry(0.35, 16, 12);
  bodyGeo.scale(1, 0.65, 1.3);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  g.add(body);

  // Belly (white)
  const bellyGeo = new THREE.SphereGeometry(0.33, 12, 8);
  bellyGeo.scale(0.8, 0.35, 1.1);
  const belly = new THREE.Mesh(bellyGeo, whiteMat);
  belly.position.y = -0.15;
  g.add(belly);

  // Neck
  const neckGeo = new THREE.CylinderGeometry(0.07, 0.1, 0.35, 8);
  const neck = new THREE.Mesh(neckGeo, darkMat);
  neck.position.set(0, 0.25, 0.45);
  neck.rotation.x = -0.6;
  g.add(neck);

  // Head
  const headGeo = new THREE.SphereGeometry(0.13, 10, 8);
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.set(0, 0.45, 0.6);
  g.add(head);

  // Eye (white + pupil)
  [-0.09, 0.09].forEach(x => {
    const eyeWhiteGeo = new THREE.SphereGeometry(0.035, 6, 6);
    const eyeWhite = new THREE.Mesh(eyeWhiteGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    eyeWhite.position.set(x, 0.48, 0.68);
    g.add(eyeWhite);

    const pupilGeo = new THREE.SphereGeometry(0.018, 4, 4);
    const pupil = new THREE.Mesh(pupilGeo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
    pupil.position.set(x, 0.48, 0.71);
    g.add(pupil);
  });

  // Beak
  const beakGeo = new THREE.ConeGeometry(0.05, 0.18, 6);
  const beak = new THREE.Mesh(beakGeo, beakMat);
  beak.position.set(0, 0.42, 0.74);
  beak.rotation.x = -Math.PI/2;
  g.add(beak);

  // Wings (will be animated)
  const wingGroupL = new THREE.Group();
  wingGroupL.position.set(-0.15, 0.05, 0.1);
  const wingGeoL = new THREE.BoxGeometry(0.08, 0.6, 0.25);
  const wingL = new THREE.Mesh(wingGeoL, wingMat);
  wingL.position.y = -0.25;
  wingGroupL.add(wingL);
  wingGroupL.name = 'wingL';
  g.add(wingGroupL);

  const wingGroupR = new THREE.Group();
  wingGroupR.position.set(0.15, 0.05, 0.1);
  const wingGeoR = new THREE.BoxGeometry(0.08, 0.6, 0.25);
  const wingR = new THREE.Mesh(wingGeoR, wingMat);
  wingR.position.y = -0.25;
  wingGroupR.add(wingR);
  wingGroupR.name = 'wingR';
  g.add(wingGroupR);

  // Tail feathers
  const tailGeo = new THREE.ConeGeometry(0.06, 0.3, 5);
  const tail = new THREE.Mesh(tailGeo, darkMat);
  tail.position.set(0, 0.1, -0.42);
  tail.rotation.x = Math.PI/2;
  g.add(tail);

  return g;
}

// ======================== LIGHTING ========================
const ambient = new THREE.AmbientLight(0x442211, 0.7);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xffcc88, 2.5);
sunLight.position.set(5, 8, -20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1024, 1024);
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 60;
sunLight.shadow.camera.left = -20;
sunLight.shadow.camera.right = 20;
sunLight.shadow.camera.top = 15;
sunLight.shadow.camera.bottom = -5;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

const rimLight = new THREE.DirectionalLight(0xff9966, 0.8);
rimLight.position.set(-3, 1, 10);
scene.add(rimLight);

// ======================== GAME STATE ========================
let ducks = [];
let score = 0;
let shotsFired = 0;
let shotsHit = 0;
let gameRunning = false;
let gameOver = false;
let duckSpawnTimer = 0;
let gameTime = 0;
const GAME_DURATION = 90; // 90 seconds per round

// Crosshair
const crosshair = document.getElementById('crosshair');
let mouseX = window.innerWidth/2;
let mouseY = window.innerHeight/2;
let mouseOnCanvas = false;

// Raycaster for shooting
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();

// DOM
const scoreDisplay = document.getElementById('score-display');
const accuracyDisplay = document.getElementById('accuracy-display');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const finalScoreEl = document.getElementById('final-score');

function updateHUD() {
  scoreDisplay.textContent = score;
  if (shotsFired > 0) {
    accuracyDisplay.textContent = Math.round(shotsHit/shotsFired*100) + '%';
  }
}

function showPop(x, y, text) {
  const el = document.createElement('div');
  el.className = 'score-pop';
  el.textContent = text;
  el.style.left = x+'px'; el.style.top = y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 800);
}

// ======================== SPAWN DUCK ========================
function spawnDuck() {
  const duck = createDuck();
  // Spawn from grass area (far sides or behind reeds)
  const side = Math.random() < 0.5 ? -1 : 1;
  duck.position.set(
    side * (8 + Math.random()*10),
    -1.5 + Math.random()*0.5,
    -6 - Math.random()*8
  );

  // Flight target
  const targetX = -side * (5 + Math.random()*12);
  const targetY = 2 + Math.random()*5;
  const targetZ = -3 - Math.random()*6;

  duck.userData = {
    startX: duck.position.x,
    startY: duck.position.y,
    startZ: duck.position.z,
    targetX, targetY, targetZ,
    progress: 0,
    speed: 0.15 + Math.random()*0.25,
    flapPhase: Math.random()*Math.PI*2,
    flapSpeed: 8 + Math.random()*8,
    alive: true,
    fallSpeed: 0,
    fallRot: new THREE.Vector3(),
    scoreValue: 100 + Math.floor(Math.random()*200),
  };

  duck.rotation.y = side > 0 ? -0.3 : Math.PI + 0.3;
  scene.add(duck);
  ducks.push(duck);
}

// ======================== HUNTING DOGS ========================
const dogs = [];

function createDog(x, z) {
  const g = new THREE.Group();
  const brown = new THREE.MeshStandardMaterial({ color: 0x6b3a20, roughness: 0.6 });
  const dark  = new THREE.MeshStandardMaterial({ color: 0x3a1a08, roughness: 0.6 });
  const tan   = new THREE.MeshStandardMaterial({ color: 0xc49460, roughness: 0.5 });

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.35,0.28,0.65), brown);
  body.position.y = 0.38; body.castShadow = true; g.add(body);

  // Chest
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.22,0.35), tan);
  chest.position.set(0,0.28,0.22); g.add(chest);

  // Head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.22), brown);
  head.position.set(0,0.62,0.38); head.castShadow = true; g.add(head);

  // Snout
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.12,0.16), dark);
  snout.position.set(0,0.56,0.54); g.add(snout);

  // Nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.04,4,4), new THREE.MeshBasicMaterial({color:0x111111}));
  nose.position.set(0,0.58,0.63); g.add(nose);

  // Ears
  [-0.09,0.09].forEach(sx=>{
    const ear = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.14,0.08), dark);
    ear.position.set(sx,0.78,0.35); ear.rotation.z = sx>0?-0.3:0.3; ear.castShadow=true; g.add(ear);
  });

  // Eyes
  [-0.06,0.06].forEach(sx=>{
    const ew = new THREE.Mesh(new THREE.SphereGeometry(0.025,4,4), new THREE.MeshBasicMaterial({color:0xffffff}));
    ew.position.set(sx,0.67,0.48); g.add(ew);
    const ep = new THREE.Mesh(new THREE.SphereGeometry(0.014,4,4), new THREE.MeshBasicMaterial({color:0x000000}));
    ep.position.set(sx,0.67,0.50); g.add(ep);
  });

  // Tail (animated group)
  const tailGrp = new THREE.Group(); tailGrp.position.set(0,0.52,-0.32);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.04,0.25,5), brown);
  tail.position.y=0.1; tail.rotation.x=-0.8; tailGrp.add(tail); g.add(tailGrp);

  // Front legs group
  const flGrp = new THREE.Group(); flGrp.position.set(0.1,0,0.25);
  [-0.1,0.1].forEach(sx=>{
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,0.3,6), brown);
    leg.position.set(sx,0.15,0); leg.castShadow=true; flGrp.add(leg);
  }); g.add(flGrp);

  // Back legs group
  const blGrp = new THREE.Group(); blGrp.position.set(0.1,0,-0.25);
  [-0.1,0.1].forEach(sx=>{
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,0.3,6), brown);
    leg.position.set(sx,0.15,0); leg.castShadow=true; blGrp.add(leg);
  }); g.add(blGrp);

  g.position.set(x,-2.0,z); g.castShadow=true; scene.add(g);

  const dog = {
    mesh:g, tailGroup:tailGrp, frontLegs:flGrp, backLegs:blGrp,
    homeX:x, homeZ:z,
    state:'idle', targetX:0, targetZ:0,
    speed:5, animPhase:0, duckRef:null, fetchTimer:0
  };
  dogs.push(dog); return dog;
}

const fetchQueue = [];
let activeDog = null;

function dispatchDog(duck) { fetchQueue.push(duck); }

function assignNextFetch() {
  if (activeDog || fetchQueue.length===0) return;
  const duck = fetchQueue.shift();
  let best=null, bestD=Infinity;
  for (const d of dogs) {
    if (d.state!=='idle') continue;
    const dx=d.homeX-duck.userData.landX, dz=d.homeZ-duck.userData.landZ;
    const dist=dx*dx+dz*dz;
    if (dist<bestD){bestD=dist;best=d;}
  }
  if(!best)return;
  activeDog=best; best.state='running_out';
  best.targetX=duck.userData.landX; best.targetZ=duck.userData.landZ;
  best.duckRef=duck; best.animPhase=0;
}

function updateDogs(dt) {
  assignNextFetch();
  for (const dog of dogs) {
    if (dog.state==='idle') {
      dog.animPhase+=dt*4;
      dog.tailGroup.rotation.y=Math.sin(dog.animPhase)*0.4;
      continue;
    }
    dog.animPhase+=dt*14;
    const swing=Math.sin(dog.animPhase)*0.45;
    dog.frontLegs.rotation.x=swing;
    dog.backLegs.rotation.x=-swing;
    dog.tailGroup.rotation.y=Math.sin(dog.animPhase*0.7)*0.15;

    const dx=dog.targetX-dog.mesh.position.x;
    const dz=dog.targetZ-dog.mesh.position.z;
    const dist=Math.sqrt(dx*dx+dz*dz);

    if (dist<0.4) {
      if (dog.state==='running_out') {
        dog.state='running_back';
        dog.targetX=dog.homeX; dog.targetZ=dog.homeZ;
        dog.fetchTimer=0.3;
        if(dog.duckRef&&dog.duckRef.userData) dog.duckRef.userData.fetched=true;
      } else if (dog.state==='running_back') {
        if(dog.fetchTimer>0){dog.fetchTimer-=dt;}
        else{
          dog.state='idle'; dog.duckRef=null; activeDog=null;
          dog.frontLegs.rotation.x=0; dog.backLegs.rotation.x=0; dog.animPhase=0;
        }
      }
    } else {
      const spd=dog.speed*dt, nx=dx/dist, nz=dz/dist;
      dog.mesh.position.x+=nx*spd; dog.mesh.position.z+=nz*spd;
      dog.mesh.rotation.y=Math.atan2(nx,nz);
      dog.mesh.position.y=-2.0+Math.abs(Math.sin(dog.animPhase))*0.06;
    }
  }
}

// Create two hunting dogs
createDog(-5, -1);
createDog(5, -1);

// ======================== SHOOT ========================
function shoot() {
  if (!gameRunning) return;
  shotsFired++;
  sfx.shoot();

  // Muzzle flash
  const flash = document.createElement('div');
  flash.className = 'muzzle-flash';
  flash.style.left = mouseX+'px';
  flash.style.top = mouseY+'px';
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 150);

  // Raycaster hit check
  mouseNDC.x = (mouseX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(mouseY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);

  let hitAny = false;
  for (const duck of ducks) {
    if (!duck.userData.alive) continue;
    const box = new THREE.Box3().setFromObject(duck);
    const center = new THREE.Vector3();
    box.getCenter(center);
    const radius = box.getSize(new THREE.Vector3()).length() * 0.45;
    const closest = new THREE.Vector3();
    raycaster.ray.closestPointToPoint(center, closest);
    if (closest.distanceTo(center) < radius) {
      duck.userData.alive = false;
      duck.userData.fallSpeed = 2;
      duck.userData.fallRot.set(
        (Math.random()-0.5)*6, (Math.random()-0.5)*6, (Math.random()-0.5)*4
      );
      score += duck.userData.scoreValue;
      shotsHit++;
      hitAny = true;
      sfx.hit();
      spawnFeathers(duck.position.clone());
      showPop(mouseX + (Math.random()-0.5)*30, mouseY - 20, '+'+duck.userData.scoreValue);
      break;
    }
  }
  if (!hitAny) sfx.miss();
  updateHUD();
}

// Feather particles
const featherParticles = [];
function spawnFeathers(pos) {
  const count = 12;
  for (let i=0;i<count;i++) {
    const geo = new THREE.PlaneGeometry(0.05, 0.12);
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(0.12, 0.3, 0.3+Math.random()*0.4),
      side: THREE.DoubleSide, transparent: true, opacity: 1,
      depthWrite: false
    });
    const feather = new THREE.Mesh(geo, mat);
    feather.position.copy(pos);
    feather.position.x += (Math.random()-0.5)*0.5;
    feather.position.y += (Math.random()-0.5)*0.3;
    feather.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    scene.add(feather);
    featherParticles.push({
      mesh: feather, mat,
      vel: new THREE.Vector3((Math.random()-0.5)*2, 1+Math.random()*2, (Math.random()-0.5)*2),
      life: 0.8+Math.random()*0.6, age: 0
    });
  }
}

// ======================== UPDATE ========================
function update(dt) {
  if (!gameRunning) return;
  dt = Math.min(dt, 0.1);

  gameTime += dt;
  if (gameTime >= GAME_DURATION) {
    endGame();
    return;
  }

  // Spawn ducks
  duckSpawnTimer -= dt;
  if (duckSpawnTimer <= 0) {
    const n = 1 + Math.floor(Math.random()*2);
    for (let i=0;i<n;i++) spawnDuck();
    duckSpawnTimer = 1.2 + Math.random()*2.5;
    if (Math.random()<0.1) sfx.duckQuack();
  }

  // Update ducks
  for (let i = ducks.length - 1; i >= 0; i--) {
    const duck = ducks[i];
    const ud = duck.userData;

    if (ud.alive) {
      // Flight path (bezier-like curve)
      ud.progress += ud.speed * dt;
      if (ud.progress > 1.2) {
        // Duck flew away
        scene.remove(duck);
        ducks.splice(i, 1);
        continue;
      }

      const t = Math.min(ud.progress, 1);
      // Arc path
      const arcHeight = 2 + Math.sin(t*Math.PI)*2;
      duck.position.x = ud.startX + (ud.targetX - ud.startX) * t;
      duck.position.y = ud.startY + arcHeight + (ud.targetY - ud.startY) * t;
      duck.position.z = ud.startZ + (ud.targetZ - ud.startZ) * t;

      // Face direction of movement
      const dx = ud.targetX - ud.startX;
      const dy = ud.targetY - ud.startY;
      duck.rotation.y = Math.atan2(-dx, -Math.abs(ud.targetZ - ud.startZ) || 1);

      // Wing flapping
      ud.flapPhase += ud.flapSpeed * dt;
      const flapAngle = Math.sin(ud.flapPhase) * 0.9;
      const wL = duck.getObjectByName('wingL');
      const wR = duck.getObjectByName('wingR');
      if (wL) wL.rotation.z = flapAngle;
      if (wR) wR.rotation.z = -flapAngle;

      // Bob up/down
      duck.position.y += Math.sin(ud.flapPhase * 0.5) * 0.08;

    } else {
      // Dead duck — fall
      ud.fallSpeed += 9.8 * dt;
      duck.position.y -= ud.fallSpeed * dt;
      duck.rotation.x += ud.fallRot.x * dt;
      duck.rotation.z += ud.fallRot.z * dt;
      duck.rotation.y += ud.fallRot.y * dt;

      if (duck.position.y < -2.0) {
        // Duck hit the ground — notify dogs
        if (!ud.landed) {
          ud.landed = true;
          ud.landX = duck.position.x;
          ud.landZ = duck.position.z;
          dispatchDog(duck);
        }
        // Keep duck visible on ground until dog fetches it
        if (ud.fetched) {
          scene.remove(duck);
          ducks.splice(i, 1);
        } else {
          duck.position.y = -2.0;
          duck.rotation.set(Math.PI/2, duck.rotation.y, 0);
        }
      }
    }
  }

  // Update dogs
  updateDogs(dt);

  // Update feathers
  for (let i = featherParticles.length-1; i >= 0; i--) {
    const fp = featherParticles[i];
    fp.age += dt;
    if (fp.age >= fp.life) {
      scene.remove(fp.mesh); fp.mesh.geometry.dispose(); fp.mat.dispose();
      featherParticles.splice(i,1);
      continue;
    }
    fp.mat.opacity = 1 - fp.age/fp.life;
    fp.mesh.position.x += fp.vel.x * dt;
    fp.mesh.position.y += fp.vel.y * dt;
    fp.mesh.position.z += fp.vel.z * dt;
    fp.vel.y -= 1.5 * dt;
    fp.mesh.rotation.z += 2 * dt;
    fp.mesh.rotation.x += 1.5 * dt;
  }

  // Slow sun descent
  sun.position.y += dt * 0.02;

  updateHUD();
}

function endGame() {
  gameRunning = false;
  gameOver = true;
  gameoverScreen.style.display = 'flex';
  finalScoreEl.textContent = score;
  document.body.style.cursor = 'default';
}

function resetGame() {
  ducks.forEach(d=>scene.remove(d)); ducks=[];
  featherParticles.forEach(f=>{scene.remove(f.mesh);f.mesh.geometry.dispose();f.mat.dispose();});
  featherParticles.length = 0;

  score=0; shotsFired=0; shotsHit=0; gameTime=0;
  duckSpawnTimer=0; gameRunning=true; gameOver=false;

  // Reset dogs
  fetchQueue.length = 0; activeDog = null;
  for (const dog of dogs) {
    dog.state='idle'; dog.duckRef=null; dog.fetchTimer=0; dog.animPhase=0;
    dog.mesh.position.set(dog.homeX, -2.0, dog.homeZ);
    dog.mesh.rotation.y=0;
    dog.frontLegs.rotation.x=0; dog.backLegs.rotation.x=0;
  }

  updateHUD();
  accuracyDisplay.textContent = '-';
  document.body.style.cursor = 'crosshair';
  gameoverScreen.style.display='none';
  startScreen.style.display='none';
}

// ======================== RENDER ========================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  update(dt);

  // Gentle camera sway
  if (gameRunning) {
    const swayX = (mouseX/window.innerWidth - 0.5) * 0.8;
    const swayY = (mouseY/window.innerHeight - 0.5) * 0.3;
    camera.position.x += (swayX - camera.position.x) * 2 * dt;
    camera.position.y += (2.4 + swayY - camera.position.y) * 2 * dt;
    camera.lookAt(swayX*0.5, 0.5 + swayY*0.5, -12);
  }

  renderer.render(scene, camera);
}

// ======================== INPUT ========================
document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  crosshair.style.left = mouseX+'px';
  crosshair.style.top = mouseY+'px';
});

// Keyboard shoot
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && gameRunning) {
    e.preventDefault();
    shoot();
  }
});

// Mobile touch on canvas
renderer.domElement.addEventListener('touchstart', e => {
  if (!gameRunning) return;
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
  crosshair.style.left = mouseX+'px';
  crosshair.style.top = mouseY+'px';
  shoot();
  e.preventDefault();
});

// Start / restart
function handleStart() { sfx.init(); resetGame(); }
document.getElementById('start-btn').addEventListener('click', handleStart);
document.getElementById('restart-btn').addEventListener('click', handleStart);

// Resize
window.addEventListener('resize', ()=>{
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// Init
updateHUD();
accuracyDisplay.textContent = '-';
crosshair.style.left = mouseX+'px';
crosshair.style.top = mouseY+'px';

renderer.domElement.addEventListener('click', e => {
  if (!gameRunning) return;
  mouseX = e.clientX;
  mouseY = e.clientY;
  crosshair.style.left = mouseX+'px';
  crosshair.style.top = mouseY+'px';

animate();
